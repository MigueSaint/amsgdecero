version: "3.9"

services:
  webamgs_cero:
    image: ghcr.io/miguesaint/amsgdecero:1.0.0
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.webamgs_cero.entrypoints=http"
        - "traefik.http.routers.webamgs_cero.rule=Host(`webamgs_cero.byronrm.com`)"
        - "traefik.http.middlewares.webamgs_cero-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.webamgs_cero.middlewares=webamgs_cero-https-redirect"
        - "traefik.http.routers.webamgs_cero-secure.entrypoints=https"
        - "traefik.http.routers.webamgs_cero-secure.rule=Host(`webamgs_cero.byronrm.com`)"
        - "traefik.http.routers.webamgs_cero-secure.tls=true"
        - "traefik.http.routers.webamgs_cero-secure.tls.certresolver=http"
        - "traefik.http.routers.webamgs_cero-secure.service=webamgs_cero"
        - "traefik.http.services.webamgs_cero.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
